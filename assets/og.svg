<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="David Galvis — Full-Stack Developer. I build software that ships to production.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset=".6" stop-color="#101012"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="violet" cx=".86" cy=".1" r=".7">
      <stop offset="0" stop-color="#9b8cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime" cx=".1" cy=".95" r=".65">
      <stop offset="0" stop-color="#d7ff3f" stop-opacity=".14"/>
      <stop offset="1" stop-color="#d7ff3f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f4f1ea" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#violet)"/>
  <rect width="1200" height="630" fill="url(#lime)"/>

  <circle cx="1050" cy="80" r="150" fill="#9b8cff" opacity=".12" filter="url(#blur)"/>
  <circle cx="120" cy="580" r="100" fill="#d7ff3f" opacity=".10" filter="url(#blur)"/>

  <text x="80" y="92" fill="#d7ff3f" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5">FULL-STACK · CLOUD · AI</text>

  <text x="78" y="218" fill="#f4f1ea" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-1.5">Construyo software</text>
  <text x="78" y="298" fill="#f4f1ea" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-1.5">que <tspan fill="#d7ff3f" font-style="italic">llega a producción.</tspan></text>

  <line x1="82" y1="354" x2="720" y2="354" stroke="#f4f1ea" stroke-opacity=".16"/>

  <text x="80" y="402" fill="#f4f1ea" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">David Stiventh Galvis Vergara</text>
  <text x="80" y="436" fill="#a7a39a" font-family="Helvetica, Arial, sans-serif" font-size="17">CTO @ fYN · Angular · Node.js · AWS serverless · LLMs</text>

  <text x="80" y="552" fill="#6f6b63" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing=".5">github.com/DavidGV-ux  ·  linkedin.com/in/stiventh-galvis-2b2843413</text>

  <text x="1040" y="500" text-anchor="middle" fill="none" stroke="#d7ff3f" stroke-opacity=".18" stroke-width="2" font-family="Georgia, 'Times New Roman', serif" font-size="330" font-weight="700">DG</text>

  <rect x="80" y="588" width="1040" height="1" fill="#d7ff3f" opacity=".35"/>
  <text x="1120" y="618" text-anchor="end" fill="#6f6b63" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2">PORTFOLIO 2026</text>
</svg>
